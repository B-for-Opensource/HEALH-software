services:
  - type: web
    name: healh-software
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://heal-final-os.netlify.app","http://localhost:5173","http://localhost:3000","*"]'
