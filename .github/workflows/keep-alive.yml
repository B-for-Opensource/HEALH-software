name: Keep Backend Alive Cron

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from idling
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://healh-software-ru1r.onrender.com/health")
          echo "Render Health Ping Status: $STATUS_CODE"
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Health check returned non-200 status code: $STATUS_CODE"
            exit 1
          fi
